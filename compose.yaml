services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-single_agent_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-single_agent_chat}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  server:
    build:
      context: .
      target: runtime
    image: single-agent-chat-server:0.1.0
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAT_SERVER_SERVICE_KEY: ${CHAT_SERVER_SERVICE_KEY:?set CHAT_SERVER_SERVICE_KEY}
      AG_UI_SERVICE_KEY: ${AG_UI_SERVICE_KEY:?set AG_UI_SERVICE_KEY}
      OPENWEBUI_USER_JWT_SECRET: ${OPENWEBUI_USER_JWT_SECRET:?set OPENWEBUI_USER_JWT_SECRET}
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-single_agent_chat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-single_agent_chat}
      SDAR_A2A_BASE_URL: ${SDAR_A2A_BASE_URL:-http://host.docker.internal:9999}
      SDAR_A2A_ENDPOINT_OVERRIDE: ${SDAR_A2A_ENDPOINT_OVERRIDE:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${CHAT_SERVER_PUBLISHED_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  frontend:
    name: single-agent-chat-frontend
