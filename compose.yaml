services:
  postgres:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-single_agent_chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-single_agent_chat}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  server:
    build:
      context: .
      target: runtime
    image: ${CHAT_SERVER_IMAGE:-single-agent-chat-server:0.6.0}
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CHAT_SERVER_SERVICE_KEY: ${CHAT_SERVER_SERVICE_KEY:?set CHAT_SERVER_SERVICE_KEY}
      AG_UI_SERVICE_KEY: ${AG_UI_SERVICE_KEY:?set AG_UI_SERVICE_KEY}
      OPENWEBUI_USER_JWT_SECRET: ${OPENWEBUI_USER_JWT_SECRET:?set OPENWEBUI_USER_JWT_SECRET}
      CHAT_CORS_ALLOW_ORIGINS: ${CHAT_CORS_ALLOW_ORIGINS:-}
      CHAT_SERVER_HOST: 0.0.0.0
      CHAT_SERVER_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-single_agent_chat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-single_agent_chat}
      SDAR_A2A_BASE_URL: ${SDAR_A2A_BASE_URL:-http://sdar:9999}
      SDAR_A2A_ENDPOINT_OVERRIDE: ${SDAR_A2A_ENDPOINT_OVERRIDE:-}
      CONVERSATION_MODEL_BASE_URL: ${CONVERSATION_MODEL_BASE_URL:?set CONVERSATION_MODEL_BASE_URL}
      CONVERSATION_MODEL_NAME: ${CONVERSATION_MODEL_NAME:?set CONVERSATION_MODEL_NAME}
      CONVERSATION_MODEL_API_KEY: ${CONVERSATION_MODEL_API_KEY:-}
      CONVERSATION_MODEL_TIMEOUT_MS: ${CONVERSATION_MODEL_TIMEOUT_MS:-30000}
      CONVERSATION_MODEL_MAX_OUTPUT_TOKENS: ${CONVERSATION_MODEL_MAX_OUTPUT_TOKENS:-2048}
      CONVERSATION_MODEL_TEMPERATURE: ${CONVERSATION_MODEL_TEMPERATURE:-0}
      CONVERSATION_MODEL_MAX_RETRIES: ${CONVERSATION_MODEL_MAX_RETRIES:-1}
      CONVERSATION_MODEL_RESPONSE_FORMAT: ${CONVERSATION_MODEL_RESPONSE_FORMAT:-json_schema}
      CONVERSATION_MAX_RECENT_MESSAGES: ${CONVERSATION_MAX_RECENT_MESSAGES:-30}
      CONVERSATION_MAX_CONTEXT_CHARS: ${CONVERSATION_MAX_CONTEXT_CHARS:-60000}
      CONVERSATION_SUMMARY_TRIGGER_CHARS: ${CONVERSATION_SUMMARY_TRIGGER_CHARS:-45000}
      CONVERSATION_MAX_TASK_SUMMARY_CHARS: ${CONVERSATION_MAX_TASK_SUMMARY_CHARS:-1000}
      CHAT_MAX_ACTIVE_TASKS_PER_CHAT: ${CHAT_MAX_ACTIVE_TASKS_PER_CHAT:-8}
      WSGS_BASE_URL: ${WSGS_BASE_URL:-http://127.0.0.1:8080}
      WSGS_BEARER_TOKEN: ${WSGS_BEARER_TOKEN:-}
      WSGS_OPERATION_TIMEOUT_MS: ${WSGS_OPERATION_TIMEOUT_MS:-120000}
      WSGS_POLL_INTERVAL_MS: ${WSGS_POLL_INTERVAL_MS:-250}
      WSGS_MAX_POLL_ATTEMPTS: ${WSGS_MAX_POLL_ATTEMPTS:-240}
      WSGS_MAX_RESPONSE_BYTES: ${WSGS_MAX_RESPONSE_BYTES:-16777216}
      SACS_WSGS_ANALYSIS_ENABLED: ${SACS_WSGS_ANALYSIS_ENABLED:-false}
      SACS_WSGS_ANALYSIS_TRANSPORT: ${SACS_WSGS_ANALYSIS_TRANSPORT:-GROUNDING_JOB}
      SACS_WSGS_ANALYSIS_CONTRACT_VERSION: ${SACS_WSGS_ANALYSIS_CONTRACT_VERSION:-sacs-wsgs-grounding/1.2}
      SACS_WSGS_ANALYSIS_RESULT_PROFILE: ${SACS_WSGS_ANALYSIS_RESULT_PROFILE:-wsgs-world-analysis-findings/1.0}
      SACS_WSGS_ANALYSIS_POLL_INTERVAL_MS: ${SACS_WSGS_ANALYSIS_POLL_INTERVAL_MS:-250}
      SACS_WSGS_ANALYSIS_MAX_WAIT_MS: ${SACS_WSGS_ANALYSIS_MAX_WAIT_MS:-120000}
      SACS_WSGS_ANALYSIS_MAX_CONSECUTIVE_POLL_FAILURES: ${SACS_WSGS_ANALYSIS_MAX_CONSECUTIVE_POLL_FAILURES:-8}
      SACS_WSGS_ANALYSIS_MAX_MAP_LAYERS: ${SACS_WSGS_ANALYSIS_MAX_MAP_LAYERS:-128}
      SACS_WSGS_ANALYSIS_MAX_TIMELINE_ITEMS: ${SACS_WSGS_ANALYSIS_MAX_TIMELINE_ITEMS:-1000}
      SACS_WSGS_ANALYSIS_MAX_RESULT_CANDIDATES: ${SACS_WSGS_ANALYSIS_MAX_RESULT_CANDIDATES:-100}
      SACS_WSGS_ANALYSIS_MAX_SAFE_PAYLOAD_BYTES: ${SACS_WSGS_ANALYSIS_MAX_SAFE_PAYLOAD_BYTES:-262144}
      SACS_WSGS_ANALYSIS_MAX_ACTIVE_PUMPS: ${SACS_WSGS_ANALYSIS_MAX_ACTIVE_PUMPS:-128}
      SACS_WSGS_ANALYSIS_ALLOW_LEGACY_1_0: ${SACS_WSGS_ANALYSIS_ALLOW_LEGACY_1_0:-true}
      SACS_WSGS_ANALYSIS_READINESS_TIMEOUT_MS: ${SACS_WSGS_ANALYSIS_READINESS_TIMEOUT_MS:-1500}
      SACS_WSGS_ANALYSIS_READINESS_CACHE_MS: ${SACS_WSGS_ANALYSIS_READINESS_CACHE_MS:-10000}
      SACS_ANALYSIS_WEB_ENABLED: ${SACS_ANALYSIS_WEB_ENABLED:-false}
      SACS_ANALYSIS_WEB_ORIGIN: ${SACS_ANALYSIS_WEB_ORIGIN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${CHAT_SERVER_PUBLISHED_PORT:-3000}:3000"
    # Used by the container readiness fixture and optional private model gateway;
    # the SDAR A2A URL defaults to the separate internal `sdar` network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - frontend
      - sdar
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  backend:
    internal: true
  frontend:
    name: ${CHAT_SERVER_FRONTEND_NETWORK:-single-agent-chat-frontend}
  sdar:
    name: ${CHAT_SERVER_SDAR_NETWORK:-single-agent-chat-sdar}
    internal: true
