name: ci

on:
  pull_request:
  push:
    branches: [main, feature/single-sdar-chat-entry-v0.1]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: single_agent_chat_phase4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d single_agent_chat_phase4"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-password@127.0.0.1:5432/single_agent_chat_phase4
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm peers check
      - run: pnpm verify:phase10

  container:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CHAT_SERVER_SERVICE_KEY: ci-service-key-at-least-32-characters
      OPENWEBUI_USER_JWT_SECRET: ci-openwebui-secret-at-least-32-characters
      POSTGRES_PASSWORD: ci-postgres-password
      CHAT_SERVER_PUBLISHED_PORT: 3000
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
      - run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: docker build --target runtime -t single-agent-chat-server:0.1.0 .
      - run: node scripts/verify-container.mjs
      - run: docker compose up -d
      - run: |
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:3000/ready && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: pnpm generate:sbom
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyclonedx-sbom
          path: reports/security/sbom.cdx.json
          if-no-files-found: error
      - if: always()
        run: docker compose down --volumes --remove-orphans
