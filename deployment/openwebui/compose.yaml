services:
  openwebui:
    image: ${OPENWEBUI_IMAGE:?required}
    env_file: ${OPENWEBUI_ENV_FILE:?required}
    ports:
      - "17.26.1.20:18084:8080"
    volumes:
      - data:/app/backend/data
    networks:
      - default
      - sacs-entrance
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)",
        ]
      interval: 10s
      timeout: 8s
      retries: 24
      start_period: 60s
volumes:
  data:
networks:
  sacs-entrance:
    external: true
    name: sacs-dev_outbound
